<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VanEtape - Hebergement van et camping-car</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--forest:#1E3A2F;--gold:#C9913A;--honey:#E8B55A;--cream:#F5EFE0;--bark:#3D2B1F;--fog:#D4CCBC;--white:#FDFAF4;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--white);color:var(--bark);}
.page{display:none;}.page.active{display:block;}
nav{position:sticky;top:0;z-index:200;background:var(--white);border-bottom:1px solid var(--fog);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:64px;box-shadow:0 1px 12px rgba(0,0,0,0.07);}
.logo{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:900;color:var(--gold);cursor:pointer;}
.logo span{color:var(--forest);}
.nav-btn{background:none;border:1.5px solid var(--fog);border-radius:50px;padding:8px 16px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:0.85rem;}
.filter-bar{display:flex;gap:8px;padding:12px 24px;border-bottom:1px solid var(--fog);overflow-x:auto;}
.chip{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 16px;border-radius:50px;border:1.5px solid var(--fog);cursor:pointer;white-space:nowrap;font-family:'DM Sans',sans-serif;background:var(--white);}
.chip.active{border-color:var(--forest);background:var(--forest);color:var(--white);}
.chip .icon{font-size:1.1rem;}.chip .label{font-size:0.7rem;font-weight:500;}
.count{padding:12px 24px;font-size:0.85rem;color:#7a8c7e;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px;padding:0 24px 40px;}
.card{cursor:pointer;border-radius:16px;overflow:hidden;box-shadow:0 4px 15px rgba(0,0,0,0.08);}
.card-img{position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;}
.card-img img{width:100%;height:100%;object-fit:cover;display:block;}
.card-badge{position:absolute;bottom:10px;left:10px;background:rgba(30,58,47,0.85);color:#E8B55A;padding:3px 10px;border-radius:50px;font-size:0.7rem;font-weight:600;}
.card-fav{position:absolute;top:10px;right:10px;background:none;border:none;cursor:pointer;font-size:1.2rem;}
.card-body{padding:10px 12px 12px;background:var(--white);}
.card-header{display:flex;justify-content:space-between;margin-bottom:4px;}
.card-title{font-weight:600;font-size:0.9rem;color:var(--bark);}
.card-rating{font-size:0.82rem;font-weight:500;}
.card-location{font-size:0.8rem;color:#7a8c7e;margin-bottom:4px;}
.card-price{font-size:0.9rem;}.card-price strong{font-weight:600;}
.detail-nav{display:flex;align-items:center;gap:12px;padding:16px 24px;border-bottom:1px solid var(--fog);position:sticky;top:0;background:var(--white);z-index:100;}
.back-btn{background:none;border:1.5px solid var(--fog);border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1rem;}
.detail-content{max-width:800px;margin:0 auto;padding:24px;}
.detail-hero{border-radius:20px;height:260px;object-fit:cover;width:100%;margin-bottom:24px;}
.detail-title{font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:900;color:var(--forest);margin-bottom:8px;}
.detail-sub{font-size:0.9rem;color:#5a6b5e;margin-bottom:16px;}
.detail-stats{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:24px;padding:16px 0;border-top:1px solid var(--fog);border-bottom:1px solid var(--fog);}
.detail-stat{font-size:0.88rem;color:var(--bark);}
.amenities{margin-bottom:24px;}
.amenities h3{font-family:'Playfair Display',serif;font-size:1.1rem;color:var(--forest);margin-bottom:12px;}
.amenity-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.amenity-item{font-size:0.88rem;color:var(--bark);}
.book-widget{background:var(--white);border:1.5px solid var(--fog);border-radius:16px;padding:24px;margin-top:24px;box-shadow:0 4px 20px rgba(0,0,0,0.08);}
.widget-price{font-family:'Playfair Display',serif;font-size:1.8rem;font-weight:900;color:var(--forest);}
.book-btn{width:100%;padding:14px;background:linear-gradient(135deg,#C9913A,#E8B55A);color:white;border:none;border-radius:12px;font-size:0.95rem;font-weight:600;cursor:pointer;margin-top:16px;font-family:'DM Sans',sans-serif;}
.price-breakdown{margin-top:16px;font-size:0.85rem;}
.pb-row{display:flex;justify-content:space-between;margin-bottom:8px;color:#5a6b5e;}
.pb-row.total{font-weight:600;color:var(--forest);border-top:1px solid var(--fog);padding-top:8px;}
</style>
</head>
<body>

<div id="homePage" class="page active">
<nav>
  <div class="logo" onclick="showPage('homePage')">Van<span>Etape</span></div>
  <div style="display:flex;align-items:center;gap:12px;">
    <a href="apropos.html" style="font-size:0.85rem;color:#5a6b5e;text-decoration:none;font-family:'DM Sans',sans-serif;">À propos</a>
    <a href="faq.html" style="font-size:0.85rem;color:#5a6b5e;text-decoration:none;font-family:'DM Sans',sans-serif;">FAQ</a>
    <button class="nav-btn" onclick="window.location.href='proposer.html'">Proposer mon van</button>
  </div>
</nav>

<div style="background:#0d1f17;padding:40px 20px;text-align:center;">
  <img src="pub2.jpg" alt="Marre des hotels" style="width:100%;max-width:560px;border-radius:16px;margin-bottom:20px;box-shadow:0 10px 30px rgba(0,0,0,0.4);">
  <img src="pub1.jpg" alt="Ton van dort dans ton garage" style="width:100%;max-width:560px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,0.4);">
  <div style="margin-top:24px;">
    <button onclick="window.location.href='proposer.html'" style="background:linear-gradient(135deg,#C9913A,#E8B55A);color:white;border:none;padding:14px 32px;border-radius:50px;font-size:1rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;">🚐 Proposer mon van gratuitement</button>
  </div>
</div>

<div class="filter-bar">
  <div class="chip active" onclick="filterVans(this,'all')"><span class="icon">🚐</span><span class="label">Tous</span></div>
  <div class="chip" onclick="filterVans(this,'van')"><span class="icon">🚌</span><span class="label">Vans</span></div>
  <div class="chip" onclick="filterVans(this,'camping')"><span class="icon">🏕️</span><span class="label">Camping-cars</span></div>
  <div class="chip" onclick="filterVans(this,'fourgon')"><span class="icon">🚚</span><span class="label">Fourgons</span></div>
  <div class="chip" onclick="filterVans(this,'luxe')"><span class="icon">✨</span><span class="label">Luxe</span></div>
</div>
<div class="count" id="count">7 vans disponibles</div>
<div class="grid" id="grid"></div>
</div>

<div id="detailPage" class="page">
<div class="detail-nav">
  <button class="back-btn" onclick="showPage('homePage')">&#8592;</button>
  <span id="detailNavTitle" style="font-weight:600;"></span>
</div>
<div class="detail-content">
  <img class="detail-hero" id="detailHero" src="" alt="">
  <h1 class="detail-title" id="detailTitle"></h1>
  <p class="detail-sub" id="detailSub"></p>
  <div class="detail-stats">
    <span class="detail-stat">★ <span id="detailRating"></span></span>
    <span class="detail-stat">📍 <span id="detailLocation"></span></span>
    <span class="detail-stat">🛌 <span id="detailCapacity"></span> pers.</span>
  </div>
  <div class="amenities">
    <h3>Equipements</h3>
    <div class="amenity-grid" id="amenityGrid"></div>
  </div>
  <div class="book-widget">
    <div class="widget-price"><span id="widgetPrice"></span> € <span style="font-size:0.9rem;font-weight:400;color:#7a8c7e;">/ nuit</span></div>
    <div class="price-breakdown">
      <div class="pb-row"><span id="pbNights"></span><span id="pbBase"></span></div>
      <div class="pb-row"><span>Frais de service (5%)</span><span id="pbFee"></span></div>
      <div class="pb-row total"><span>Total</span><span id="pbTotal"></span></div>
    </div>
    <button class="book-btn" id="bookBtn">Reserver maintenant</button>
    <p style="text-align:center;font-size:0.75rem;color:#8a9a8e;margin-top:10px;">Aucun debit avant confirmation</p>
  </div>
</div>
</div>

<div style="text-align:center;padding:20px;font-size:0.8rem;color:#7a8c7e;border-top:1px solid #D4CCBC;margin-top:40px;">
  © 2026 VanEtape — <a href="mentions.html" style="color:#C9913A;text-decoration:none;">Mentions légales</a>
</div>

<script>
var vans=[
  {id:1,img:'images/vanlife/VAN1.jpg',title:'Volkswagen T6 - Cosy et tout equipe',location:'Lyon, Rhone-Alpes',type:'van',price:38,rating:4.9,reviews:42,capacity:2,amenities:['Lit double','Cuisine','Electricite','Douche','WiFi','Panneau solaire','Animaux OK','Climatisation']},
  {id:2,img:'images/vanlife/VAN2.jpg',title:'Camping-car Fiat Ducato - Famille',location:'Bordeaux, Nouvelle-Aquitaine',type:'camping',price:55,rating:4.8,reviews:27,capacity:4,amenities:['2 lits','Cuisine equipee','WC integre','Douche','220V','Frigo','TV','Porte-velos']},
  {id:3,img:'images/vanlife/VAN3.jpg',title:'Renault Master - Vintage et chaleureux',location:'Marseille, Provence',type:'fourgon',price:29,rating:5.0,reviews:18,capacity:2,amenities:['Lit queen','Rechaud gaz','Panneau solaire','Cafe inclus','Deco vintage','Bibliotheque']},
  {id:4,img:'images/vanlife/VAN4.jpg',title:'Mercedes Sprinter - Luxe et confort',location:'Nice, Cote Azur',type:'luxe',price:95,rating:4.9,reviews:31,capacity:2,amenities:['Lit king','Douche chaude','Panneau solaire','Climatisation','WiFi haut debit','Minibar']},
  {id:5,img:'images/vanlife/VAN5.jpg',title:'Ford Transit - Aventurier des cimes',location:'Grenoble, Isere',type:'van',price:42,rating:4.7,reviews:15,capacity:2,amenities:['Lit double','Cuisine','Panneau solaire','Equip montagne','Porte-velos','GPS inclus']},
  {id:6,img:'images/vanlife/VAN6.jpg',title:'Citroen Jumper - Nature et serenite',location:'Nantes, Pays de la Loire',type:'fourgon',price:33,rating:4.8,reviews:22,capacity:2,amenities:['Lit double','Solaire','Cuisine','Animaux bienvenus','Deco artisanale','Cafe inclus']},
  {id:7,img:'images/vanlife/VAN7.jpg',title:'Peugeot Boxer - Van amenage proche plages',location:'Montpellier, Herault',type:'van',price:40,rating:5.0,reviews:1,capacity:3,amenities:['3 couchages','Glaciere electrique','Proche des plages','Centre-ville Carnon','Proche festivites','Toutes commodites']}
];
var currentVan=null;
function showPage(id){document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');});document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
function getType(t){if(t==='van')return 'Van amenage';if(t==='camping')return 'Camping-car';if(t==='fourgon')return 'Fourgon';return 'Luxe';}
function renderGrid(list){
  document.getElementById('count').textContent=list.length+' vans disponibles';
  document.getElementById('grid').innerHTML=list.map(function(v){
    return '<div class="card"><div class="card-img" onclick="openDetail('+v.id+')">'
      +'<img src="'+v.img+'" alt="'+v.title+'" loading="lazy">'
      +'<div class="card-badge">'+getType(v.type)+'</div>'
      +'</div>'
      +'<div class="card-body" onclick="openDetail('+v.id+')">'
      +'<div class="card-header"><div class="card-title">'+v.title+'</div><div class="card-rating">★'+v.rating+'</div></div>'
      +'<div class="card-location">📍 '+v.location+'</div>'
      +'<div class="card-price"><strong>'+v.price+' €</strong> / nuit</div>'
      +'</div></div>';
  }).join('');}
function filterVans(chip,type){document.querySelectorAll('.chip').forEach(function(c){c.classList.remove('active');});chip.classList.add('active');renderGrid(type==='all'?vans:vans.filter(function(v){return v.type===type;}));}
function openDetail(id){
  currentVan=vans.find(function(v){return v.id===id;});
  var v=currentVan;
  document.getElementById('detailNavTitle').textContent=v.title;
  document.getElementById('detailHero').src=v.img;
  document.getElementById('detailHero').alt=v.title;
  document.getElementById('detailTitle').textContent=v.title;
  document.getElementById('detailSub').textContent=getType(v.type)+' · '+v.location+' · ★ '+v.rating+' ('+v.reviews+' avis)';
  document.getElementById('detailRating').textContent=v.rating+' ('+v.reviews+' avis)';
  document.getElementById('detailLocation').textContent=v.location;
  document.getElementById('detailCapacity').textContent=v.capacity;
  document.getElementById('widgetPrice').textContent=v.price;
  var fee=Math.round(v.price*0.05*100)/100;
  var total=Math.round((v.price+fee)*100)/100;
  document.getElementById('pbNights').textContent=v.price+' x 1 nuit';
  document.getElementById('pbBase').textContent=v.price+' €';
  document.getElementById('pbFee').textContent=fee.toFixed(2)+' €';
  document.getElementById('pbTotal').textContent=total.toFixed(2)+' €';
  document.getElementById('amenityGrid').innerHTML=v.amenities.map(function(a){return '<div class="amenity-item">✓ '+a+'</div>';}).join('');
  document.getElementById('bookBtn').onclick=function(){
    window.location.href='paiement.html?prix='+v.price+'&titre='+encodeURIComponent(v.title)+'&lieu='+encodeURIComponent(v.location);
  };
  showPage('detailPage');
}
renderGrid(vans);
</script>
</body>
</html>
